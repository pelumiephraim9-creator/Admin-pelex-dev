name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          find . -type d \( -name .git -o -name node_modules \) -prune -o -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Run backend foundation tests
        run: npm test
